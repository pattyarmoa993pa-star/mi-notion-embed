<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civikédex — Simulación</title>
<style>
  :root{
    --navy:#1B2635; --panel:#2C3E50; --screen:#0F1620; --cream:#F4F1EA; --ink:#14213D;
    --red:#E74C3C; --green:#00E676; --yellow:#FFDE00; --blue:#4A90E2; --muted:#9fb3c8;
    --sans:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"SFMono-Regular",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:radial-gradient(1200px 600px at 20% -10%,#26384f 0%,var(--navy) 60%);color:var(--cream);font-family:var(--sans);padding:24px 16px 40px}
  .app{max-width:1080px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:46px;height:46px;border-radius:50%;background:var(--blue);border:5px solid var(--cream);box-shadow:0 0 0 6px var(--red)}
  h1{font-size:30px;line-height:1}
  .brand p{font-size:14px;color:var(--muted);margin-top:4px}
  .prog{flex:1;min-width:220px}
  .bar{height:14px;background:#0F1620;border-radius:99px;overflow:hidden;border:1px solid #3d5167}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--yellow));transition:width .6s ease}
  #progtxt{display:block;margin-top:6px;font-size:14px;color:var(--muted)}
  .tabs{display:flex;gap:8px}
  .tabs button{background:#243447;color:var(--cream);border:1px solid #3d5167;border-radius:10px;padding:10px 16px;font:600 15px var(--sans);cursor:pointer}
  .tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
  .tabs button:hover{filter:brightness(1.15)}
  main{display:grid;grid-template-columns:300px 1fr;gap:22px}
  @media (max-width:820px){main{grid-template-columns:1fr}}
  .list{background:var(--panel);border:2px solid #3d5167;border-radius:16px;padding:18px;align-self:start}
  .ltitle{font-weight:700;font-size:15px;letter-spacing:1px;margin-bottom:12px}
  #items{display:flex;flex-direction:column;gap:8px}
  .item{--c:#888;display:flex;align-items:center;gap:12px;background:var(--cream);color:var(--ink);border:3px solid transparent;border-radius:10px;padding:10px 12px;font:600 16px var(--sans);text-align:left;cursor:pointer;transition:transform .15s}
  .item:hover{transform:translateX(4px)}
  .item .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);font-size:18px;flex:none}
  .item.locked{background:#3a4c60;color:#8ea2b8}
  .item.locked .dot{background:#26384b;filter:grayscale(1)}
  .item.sel{border-color:var(--red);box-shadow:0 0 0 3px rgba(231,76,60,.35)}
  .item small{display:block;font-weight:400;font-size:12px;opacity:.75}
  .device{background:var(--red);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
  .lights{display:flex;align-items:center;gap:12px}
  .lights i{display:block;border-radius:50%}
  .lights .big{width:44px;height:44px;background:var(--blue);border:4px solid var(--cream);animation:blink 2.4s infinite}
  .lights .sm{width:14px;height:14px}
  @keyframes blink{50%{box-shadow:0 0 18px 4px rgba(74,144,226,.9)}}
  .screen{position:relative;background:var(--screen);border:5px solid var(--ink);border-radius:16px;padding:24px;min-height:520px;overflow:hidden}
  .screen.flash{animation:flash .7s}
  @keyframes flash{0%{box-shadow:inset 0 0 0 0 var(--fc)}30%{box-shadow:inset 0 0 90px 10px var(--fc)}100%{box-shadow:inset 0 0 0 0 var(--fc)}}
  .mono{font-family:var(--mono)}
  .empty{display:grid;place-items:center;text-align:center;min-height:460px;color:var(--muted);gap:10px}
  .empty b{color:var(--green);font-family:var(--mono);font-size:20px}
  .fh{display:flex;align-items:center;gap:18px;margin-bottom:16px}
  .avatar{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:44px;background:radial-gradient(circle at 30% 30%,var(--c),#0F1620 130%);box-shadow:0 0 28px var(--c);animation:float 3s ease-in-out infinite;flex:none}
  @keyframes float{50%{transform:translateY(-6px)}}
  .nm{font-family:var(--mono);font-weight:700;font-size:26px;line-height:1.1}
  .badge{display:inline-block;margin-top:8px;border:2px solid;border-radius:99px;padding:3px 12px;font-size:14px;font-weight:600}
  .new{display:inline-block;background:var(--yellow);color:var(--ink);font-weight:700;font-size:13px;border-radius:6px;padding:3px 9px;margin-left:8px;animation:pop .5s}
  @keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
  .row{font-size:17px;margin-bottom:6px}
  .row b{color:var(--green);font-family:var(--mono);font-size:14px;margin-right:8px}
  .sec{margin:16px 0 6px;color:var(--green);font-size:14px;text-decoration:underline}
  .desc{font-size:17px;line-height:1.5;min-height:52px}
  .ab{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#1b2635;border-radius:12px;padding:14px 16px}
  .ab b{display:block;color:var(--yellow);font-style:italic;font-size:18px}
  .ab span{font-size:14px;color:var(--muted)}
  button.go{background:var(--yellow);color:var(--ink);border:0;border-radius:10px;padding:10px 16px;font:700 15px var(--sans);cursor:pointer;flex:none}
  button.go:hover{filter:brightness(1.1)}
  #fx{margin-top:14px;font-size:16px;line-height:1.5;min-height:48px;color:var(--cream)}
  .ring{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border:4px solid var(--fc);border-radius:50%;opacity:0;pointer-events:none}
  .ring.go{animation:ring .9s ease-out}
  @keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(22)}}
  .scan{display:grid;place-items:center;text-align:center;gap:18px;min-height:460px}
  .radar{width:150px;height:150px;border-radius:50%;border:3px solid var(--green);background:conic-gradient(from 0deg,rgba(0,230,118,.55),transparent 55%);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sbar{width:260px;height:10px;background:#1b2635;border-radius:99px;overflow:hidden}
  .sbar i{display:block;height:100%;background:var(--green);animation:fill 1.1s linear forwards}
  @keyframes fill{from{width:0}to{width:100%}}
  .scan p{color:var(--green);font-family:var(--mono)}
  /* desafio */
  .dh{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;font-family:var(--mono);margin-bottom:14px}
  .sit{font-size:23px;line-height:1.4;font-weight:600;background:#1b2635;border-left:6px solid var(--yellow);border-radius:10px;padding:18px 20px;margin-bottom:8px}
  .ask{color:var(--green);font-size:14px;margin:14px 0 10px;font-family:var(--mono)}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
  .opt{--c:#888;display:flex;align-items:center;gap:10px;background:var(--cream);color:var(--ink);border:3px solid transparent;border-radius:10px;padding:12px;font:600 15px var(--sans);cursor:pointer;text-align:left}
  .opt:hover:not(:disabled){transform:translateY(-2px)}
  .opt:disabled{cursor:default}
  .opt.wrong{background:#5a2a2a;color:#f3b4ae;animation:shake .4s}
  .opt.right{background:var(--green);border-color:#fff}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .fb{margin-top:16px;font-size:16px;line-height:1.5;background:#12301f;border:2px solid var(--green);border-radius:12px;padding:14px 16px}
  .fb.hint{background:#33290f;border-color:var(--yellow)}
  .fb b{color:var(--yellow)}
  .nextrow{margin-top:14px;text-align:right}
  .sum{text-align:center;display:grid;gap:14px;place-items:center;min-height:460px;align-content:center}
  .sum .rank{font-size:30px;font-weight:700;color:var(--yellow)}
  .sum .pts{font-family:var(--mono);font-size:44px;color:var(--green)}
  footer{margin-top:22px;text-align:center;color:var(--muted);font-size:14px}
  .conf{position:fixed;top:-30px;font-size:26px;pointer-events:none;animation:fall linear forwards;z-index:9}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
  .banner{background:var(--yellow);color:var(--ink);font-weight:700;text-align:center;border-radius:10px;padding:10px;margin-bottom:14px;animation:pop .5s}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="logo"></span><div><h1>Civikédex</h1><p>El buscador del Estado · simulación</p></div></div>
    <div class="prog"><div class="bar"><i id="barfill"></i></div><span id="progtxt">0 / 6 registrados</span></div>
    <nav class="tabs">
      <button id="tab-reg" class="on">📖 Registro</button>
      <button id="tab-des">🎯 Desafío</button>
      <button id="reset" title="Reiniciar">↺</button>
    </nav>
  </header>
  <main>
    <aside class="list"><div class="ltitle">REGISTRO ESTATAL</div><div id="items"></div></aside>
    <section class="device">
      <div class="lights"><i class="big"></i><i class="sm" style="background:#FFDE00"></i><i class="sm" style="background:#F4F1EA"></i><i class="sm" style="background:#00E676"></i></div>
      <div class="screen" id="screen"></div>
    </section>
  </main>
  <footer>Tocá un organismo bloqueado para escanearlo, o jugá el Desafío para descubrirlos resolviendo situaciones.</footer>
</div>

<script>
(function(){
  var O=[
    {id:'ejecutivo',n:'Poder Ejecutivo',e:'🏛️',tipo:'Gubernamental / Central',lider:'Presidente de la República',
     desc:'Se encarga de administrar el país, ejecutar las leyes y dirigir las políticas públicas.',
     hab:'Decreto Supremo',habDesc:'Toma decisiones ejecutivas para el bienestar del país.',
     fx:'Decreto Supremo activado: se toma una decisión ejecutiva para el bienestar del país.',
     color:'#4A90E2',sit:'Hay que dirigir las políticas públicas y ejecutar las leyes ya aprobadas.'},
    {id:'legislativo',n:'Poder Legislativo',e:'📜',tipo:'Deliberativo / Normativo',lider:'Presidente del Congreso / Parlamento',
     desc:'Formado por Senadores y Diputados. Su rol principal es proponer, debatir y aprobar las leyes.',
     hab:'Voto Mayoritario',habDesc:'Modifica las reglas del juego (leyes) para regular la convivencia.',
     fx:'Voto Mayoritario activado: cambia una regla del juego para regular la convivencia.',
     color:'#50E3C2',sit:'La comunidad necesita una nueva regla: hay que proponer, debatir y aprobar una ley.'},
    {id:'judicial',n:'Poder Judicial',e:'⚖️',tipo:'Justicia / Autónomo',lider:'Presidente de la Corte Suprema',
     desc:'Se encarga de hacer cumplir las leyes, resolver conflictos y castigar a quienes las infringen.',
     hab:'Sentencia Inapelable',habDesc:'Resuelve disputas aplicando la Constitución con total neutralidad.',
     fx:'Sentencia activada: la disputa se resuelve aplicando la Constitución con neutralidad.',
     color:'#F5A623',sit:'Dos vecinos tienen un conflicto y alguien debe resolverlo aplicando la Constitución.'},
    {id:'salud',n:'Ministerio de Salud',e:'🩺',tipo:'Bienestar / Social',lider:'Ministro(a) de Salud',
     desc:'Diseña las estrategias de salud pública, gestiona hospitales y combate epidemias.',
     hab:'Mega Curación',habDesc:'Protege la vida de los ciudadanos ante amenazas biológicas y enfermedades.',
     fx:'Mega Curación activada: la población queda protegida ante la amenaza biológica.',
     color:'#E24A4A',sit:'Se declara una epidemia y los hospitales necesitan una estrategia.'},
    {id:'educacion',n:'Ministerio de Educación',e:'📚',tipo:'Desarrollo / Social',lider:'Ministro(a) de Educación',
     desc:'Financia escuelas, define los planes de estudio y promueve el aprendizaje y la cultura.',
     hab:'Mente Brillante',habDesc:'Potencia el conocimiento de niños y jóvenes para el futuro del país.',
     fx:'Mente Brillante activada: niños y jóvenes ganan conocimiento para el futuro del país.',
     color:'#B8E986',sit:'Hay que financiar escuelas y definir los planes de estudio del año.'},
    {id:'banco',n:'Banco Central',e:'🏦',tipo:'Económico / Autónomo',lider:'Presidente del Banco Central',
     desc:'Controla la inflación, emite los billetes y monedas, y cuida la estabilidad de la economía.',
     hab:'Escudo Anti-Inflación',habDesc:'Mantiene el valor del dinero para que los precios no suban sin control.',
     fx:'Escudo Anti-Inflación activado: los precios dejan de subir descontroladamente.',
     color:'#9B51E0',sit:'Los precios suben sin control y hay que cuidar el valor del dinero.'}
  ];
  var byId={};O.forEach(function(o){byId[o.id]=o});
  var found={},sel=null,mode='reg',scanning=false,typeTok=0;
  var ch={order:[],i:0,score:0,tries:0,done:false};
  var $=function(id){return document.getElementById(id)};
  var screen=$('screen');

  function count(){return Object.keys(found).length}
  function updateProgress(){
    $('barfill').style.width=(count()/O.length*100)+'%';
    $('progtxt').textContent=count()+' / '+O.length+' registrados'+(count()===O.length?' · ¡registro completo!':'');
  }
  function renderList(){
    var h='';
    O.forEach(function(o){
      var f=found[o.id];
      h+='<button class="item'+(f?'':' locked')+(sel===o.id?' sel':'')+'" data-id="'+o.id+'" style="--c:'+o.color+'">'
        +'<span class="dot">'+(f?o.e:'🔒')+'</span><span>'+(f?o.n:'??? Sin registrar')+'<small>'+(f?o.tipo:'Tocá para escanear')+'</small></span></button>';
    });
    $('items').innerHTML=h;
    [].forEach.call($('items').querySelectorAll('.item'),function(b){b.onclick=function(){choose(b.getAttribute('data-id'))}});
  }
  function confetti(){
    var em=['🎉','⭐','✨','🏅','🎊'];
    for(var k=0;k<36;k++){
      var s=document.createElement('span');s.className='conf';s.textContent=em[k%em.length];
      s.style.left=(Math.random()*100)+'vw';s.style.animationDuration=(2+Math.random()*2.5)+'s';s.style.animationDelay=(Math.random()*0.8)+'s';
      document.body.appendChild(s);setTimeout((function(n){return function(){n.remove()}})(s),5200);
    }
  }
  function discover(id){
    if(found[id])return false;
    found[id]=true;renderList();updateProgress();
    if(count()===O.length)setTimeout(confetti,300);
    return true;
  }
  function typeText(el,text){
    var tok=++typeTok,k=0;el.textContent='';
    (function step(){if(tok!==typeTok)return;k+=2;el.textContent=text.slice(0,k);if(k<text.length)setTimeout(step,16)})();
  }
  function ring(color){
    screen.style.setProperty('--fc',color);
    screen.classList.remove('flash');void screen.offsetWidth;screen.classList.add('flash');
    var r=document.createElement('div');r.className='ring';screen.appendChild(r);
    void r.offsetWidth;r.classList.add('go');setTimeout(function(){r.remove()},1000);
  }

  function setMode(m){
    mode=m;
    $('tab-reg').classList.toggle('on',m==='reg');
    $('tab-des').classList.toggle('on',m==='des');
    if(m==='reg'){showRegistry()}else{if(ch.order.length===0||ch.done)startChallenge();else renderChallenge()}
  }
  function showRegistry(){
    if(sel&&found[sel]){showFicha(sel,false)}
    else{screen.innerHTML='<div class="empty"><div><div style="font-size:56px">🗂️</div><b>SELECCIONA UN ORGANISMO</b><p style="margin-top:8px">Escanealo para sumarlo a tu Civikédex.</p></div></div>'}
  }
  function choose(id){
    if(scanning)return;
    sel=id;
    if(mode!=='reg'){mode='reg';$('tab-reg').classList.add('on');$('tab-des').classList.remove('on')}
    renderList();
    if(found[id]){showFicha(id,false)}else{scan(id)}
  }
  function scan(id){
    scanning=true;
    screen.innerHTML='<div class="scan"><div class="radar"></div><p>ESCANEANDO ORGANISMO…</p><div class="sbar"><i></i></div></div>';
    setTimeout(function(){
      scanning=false;discover(id);
      if(sel===id&&mode==='reg')showFicha(id,true);
    },1150);
  }
  function showFicha(id,isNew){
    var o=byId[id];
    screen.style.setProperty('--fc',o.color);
    screen.innerHTML=
      (count()===O.length&&isNew?'<div class="banner">🏆 ¡Completaste el Registro Estatal!</div>':'')
      +'<div class="fh"><div class="avatar" style="--c:'+o.color+'">'+o.e+'</div><div>'
      +'<div class="nm" style="color:'+o.color+'">'+o.n.toUpperCase()+(isNew?'<span class="new">¡NUEVO!</span>':'')+'</div>'
      +'<span class="badge" style="color:'+o.color+';border-color:'+o.color+'">'+o.tipo+'</span></div></div>'
      +'<p class="row"><b>LÍDER</b>'+o.lider+'</p>'
      +'<div class="sec">Función principal (rol)</div><p class="desc" id="desc"></p>'
      +'<div class="sec">Habilidad especial</div>'
      +'<div class="ab"><div><b>'+o.hab+'</b><span>'+o.habDesc+'</span></div><button class="go" id="use">⚡ Usar</button></div>'
      +'<div id="fx"></div>';
    typeText($('desc'),o.desc);
    $('use').onclick=function(){ring(o.color);typeText($('fx'),o.fx)};
    if(isNew)ring(o.color);
  }

  /* DESAFIO */
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function startChallenge(){
    ch={order:shuffle(O.map(function(o){return o.id})),i:0,score:0,tries:0,done:false};
    renderChallenge();
  }
  function renderChallenge(){
    if(ch.i>=ch.order.length){return renderSummary()}
    var cur=byId[ch.order[ch.i]];
    var h='<div class="dh"><span>SITUACIÓN '+(ch.i+1)+' / '+ch.order.length+'</span><span>PUNTOS: '+ch.score+'</span></div>'
      +'<div class="sit">'+cur.sit+'</div>'
      +'<div class="ask">¿QUIÉN SE ENCARGA?</div><div class="opts" id="opts">';
    O.forEach(function(o){h+='<button class="opt" data-id="'+o.id+'"><span style="font-size:22px">'+o.e+'</span>'+o.n+'</button>'});
    h+='</div><div id="fbox"></div>';
    screen.innerHTML=h;
    [].forEach.call(screen.querySelectorAll('.opt'),function(b){b.onclick=function(){answer(b)}});
  }
  function answer(btn){
    var id=btn.getAttribute('data-id'),curId=ch.order[ch.i],cur=byId[curId];
    if(id===curId){
      var pts=ch.tries===0?10:5;ch.score+=pts;
      [].forEach.call(screen.querySelectorAll('.opt'),function(b){b.disabled=true});
      btn.classList.add('right');
      var isNew=discover(curId);
      ring(cur.color);
      $('fbox').innerHTML='<div class="fb">✅ <b>¡Correcto! +'+pts+' puntos.</b> '+cur.n+' usa su habilidad: <b>'+cur.hab+'</b>. '+cur.habDesc+(isNew?' <b>¡Nuevo registro desbloqueado!</b>':'')+'</div>'
        +'<div class="nextrow"><button class="go" id="nx">'+(ch.i+1>=ch.order.length?'Ver resultado →':'Siguiente →')+'</button></div>';
      $('nx').onclick=function(){ch.i++;ch.tries=0;renderChallenge()};
    }else{
      ch.tries++;btn.disabled=true;btn.classList.add('wrong');
      var tip=ch.tries>=2?'Pista: es de tipo <b>'+cur.tipo+'</b>.':'Casi. Pensá en qué hace cada organismo y probá de nuevo.';
      $('fbox').innerHTML='<div class="fb hint">'+tip+'</div>';
    }
  }
  function renderSummary(){
    ch.done=true;
    var rank=ch.score>=55?'🏆 Maestro del Estado':(ch.score>=35?'🛡️ Guardián cívico':'🌱 Aprendiz cívico');
    screen.innerHTML='<div class="sum"><div style="font-size:15px;color:var(--muted)" class="mono">RESULTADO DEL DESAFÍO</div>'
      +'<div class="pts">'+ch.score+' / '+(O.length*10)+'</div><div class="rank">'+rank+'</div>'
      +'<p style="color:var(--muted);max-width:420px">Registraste '+count()+' de '+O.length+' organismos. Cada acierto te enseña qué hace cada parte del Estado.</p>'
      +'<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="go" id="again">Jugar de nuevo</button><button class="go" id="goreg" style="background:var(--cream)">Ver mi registro</button></div></div>';
    if(ch.score>=55)confetti();
    $('again').onclick=startChallenge;
    $('goreg').onclick=function(){setMode('reg')};
  }

  $('tab-reg').onclick=function(){setMode('reg')};
  $('tab-des').onclick=function(){setMode('des')};
  $('reset').onclick=function(){found={};sel=null;scanning=false;ch={order:[],i:0,score:0,tries:0,done:false};renderList();updateProgress();setMode('reg')};

  renderList();updateProgress();showRegistry();
})();
</script>
</body>
</html>
