<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>¿Aguantará la estructura?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Press+Start+2P&display=swap">
<style>
/* Concepto: plano de obra nocturno. La rejilla de 6x5 es el protagonista, el panel de pruebas queda al lado. */
:root {
  --bg: #0a1a2b;
  --panel: #0e2339;
  --cell: #0f2a45;
  --line: #24527d;
  --line-soft: #183a5a;
  --ink: #e9f2fa;
  --mute: #93b3cd;
  --tape: #ffc21a;
  --tape-ink: #1c1500;
  --ok: #46e0a0;
  --bad: #ff5d4f;
  --steel-1: #bcd0e0;
  --steel-2: #8aa3b8;
  --steel-3: #4b6379;
  --soil: #3a2f26;
  --mc0: #5cc8f2;
  --mc1: #6fe0b0;
  --mc2: #ff9f5a;
  --mc3: #b9a3ff;
  --mc4: #ff86b6;
  --font-display: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --font-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size: 28px 28px;
  background-position: -1px -1px;
}
.wrap {
  max-width: 1020px;
  margin: 0 auto;
  padding-block: 20px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--tape); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Cabecera */
header { display: grid; gap: 14px; margin-bottom: 18px; }
h1 {
  margin: 0;
  font: 400 clamp(14px, 4.1vw, 22px)/1.5 var(--font-display);
  letter-spacing: 0.02em;
  text-wrap: balance;
  text-transform: uppercase;
}
h1 span { color: var(--tape); }
.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-weight: 700; font-size: 13px; color: var(--mute); }
.seg button[aria-pressed="true"] { background: var(--tape); color: var(--tape-ink); }
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 118px)); gap: 8px; }
.lv {
  display: grid; gap: 1px; text-align: left; padding: 6px 10px; min-width: 0;
  background: var(--panel); border: 2px solid var(--line); border-radius: 3px;
}
.lv b { font: 400 10px/1.6 var(--font-display); color: var(--mute); }
.lv span { font-size: 13px; font-weight: 700; }
.lv i { font-style: normal; color: var(--tape); letter-spacing: 2px; font-size: 13px; min-height: 18px; }
.lv[aria-pressed="true"] { border-color: var(--tape); background: #14304d; }
.lv[aria-pressed="true"] b { color: var(--tape); }
.steps { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; padding: 0; list-style: none; color: var(--mute); font-size: 13px; }
.steps li { display: flex; align-items: center; gap: 6px; }
.steps b { font: 400 9px/1 var(--font-display); color: var(--tape-ink); background: var(--tape); padding: 4px 5px; border-radius: 2px; }

/* Distribución */
.main { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); }
#build { grid-area: build; }
#brief { grid-area: brief; }
#results { grid-area: results; }
.main { grid-template-areas: "brief" "build" "results"; }
@media (min-width: 880px) {
  .main { grid-template-columns: minmax(0, 500px) minmax(0, 1fr); grid-template-areas: "build brief" "build results"; align-items: start; }
}
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 3px; padding: 14px 16px; }
h2 { margin: 0 0 8px; font: 400 11px/1.6 var(--font-display); color: var(--tape); text-transform: uppercase; letter-spacing: 0.04em; }
.card p { margin: 0 0 8px; max-width: 62ch; }
.card p:last-child { margin-bottom: 0; }
.fine { color: var(--mute); font-size: 14px; }
.fine::before { content: ""; display: inline-block; width: 18px; height: 6px; margin-right: 8px; vertical-align: middle;
  background: repeating-linear-gradient(135deg, var(--tape) 0 3px, #1c1500 3px 6px); }

/* Módulos del cliente */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; padding: 0; list-style: none; }
.chip {
  display: grid; grid-template-columns: auto 1fr; gap: 0 8px; align-items: center; text-align: left;
  padding: 7px 10px 7px 8px; background: #0b1d30; border: 2px solid var(--line); border-radius: 3px; min-width: 132px;
}
.chip .sw { grid-row: span 2; width: 22px; height: 22px; border-radius: 2px; border: 2px solid #0b1d30; }
.chip b { font-size: 14px; }
.chip small { color: var(--mute); font-size: 12px; }
.chip[aria-pressed="true"] { border-color: var(--tape); background: #14304d; }
.chip.placed b::after { content: " \2713"; color: var(--ok); }
.mc0 { background: var(--mc0); } .mc1 { background: var(--mc1); } .mc2 { background: var(--mc2); }
.mc3 { background: var(--mc3); } .mc4 { background: var(--mc4); }

/* Tablero */
.board {
  display: grid; grid-template-columns: 2.6rem repeat(6, minmax(0, 1fr)); gap: 3px;
  padding: 10px 10px 0 6px; background: var(--panel); border: 2px solid var(--line); border-bottom: 0; border-radius: 3px 3px 0 0;
}
.rl { display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; color: var(--mute); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; text-align: right; line-height: 1.1; }
.cell {
  position: relative; aspect-ratio: 1; padding: 0; min-width: 0; display: block; overflow: hidden;
  background: var(--cell); border: 1px solid var(--line-soft); border-radius: 2px;
}
.cell svg { display: block; width: 100%; height: 100%; }
.cell:hover:not(:disabled) { border-color: var(--line); }
.cell.can { outline: 2px dashed var(--tape); outline-offset: -3px; }
.cell.blocked { cursor: not-allowed; background: repeating-linear-gradient(135deg, #0b1c2e 0 5px, #0e2237 5px 10px); border-color: transparent; }
.soil { height: 14px; border: 2px solid var(--line); border-top: 0; border-radius: 0 0 3px 3px; margin-bottom: 8px;
  background: repeating-linear-gradient(90deg, var(--soil) 0 10px, #4a3d32 10px 14px); }
.s1 { fill: var(--steel-1); } .s2 { fill: var(--steel-2); } .s3 { fill: var(--steel-3); }
.y { fill: var(--tape); } .yd { fill: #1c1500; } .rd { fill: var(--bad); }
.mod { position: absolute; inset: 3px; display: grid; place-items: center; border-radius: 2px; color: #08121d; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.22); }
.mod b { font: 400 clamp(8px, 2.3vw, 11px)/1 var(--font-display); letter-spacing: 0; }
.mod i { position: absolute; right: 3px; bottom: 5px; font: 700 clamp(10px, 2.6vw, 12px)/1 var(--font-body); font-style: normal; }
.mod::before { content: ""; position: absolute; left: 4px; top: 4px; width: 22%; height: 18%; background: rgba(255,255,255,0.45); }

/* Estados de prueba */
.cell.crack { outline: 3px solid var(--bad); outline-offset: -3px; animation: shake 0.4s steps(4) 2; }
.cell.crack::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 46%, var(--bad) 46% 50%, transparent 50%) 0 0 / 100% 55% no-repeat,
              linear-gradient(60deg, transparent 46%, var(--bad) 46% 50%, transparent 50%) 0 100% / 100% 55% no-repeat; }
.cell.weak { outline: 3px solid var(--tape); outline-offset: -3px; }
.cell.newslot { outline: 3px dashed var(--ok); outline-offset: -3px; }
.cell.newslot::after { content: "+"; position: absolute; inset: 0; display: grid; place-items: center; font: 400 14px var(--font-display); color: var(--ok); }
@keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } 100% { transform: translateX(0); } }

/* Herramientas */
.tools { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
.tool { display: grid; justify-items: center; gap: 3px; padding: 6px 2px 5px; background: var(--panel); border: 2px solid var(--line); border-radius: 3px; min-width: 0; }
.tool svg { width: 30px; height: 30px; }
.tool b { font-size: 12px; line-height: 1.1; text-align: center; overflow-wrap: anywhere; }
.tool small { color: var(--mute); font-size: 11px; }
.tool[aria-pressed="true"] { border-color: var(--tape); background: #14304d; }
.hint { min-height: 2.8em; margin: 0 0 10px; color: var(--mute); font-size: 14px; }

/* Presupuesto y botones */
.budget { display: grid; gap: 5px; margin-bottom: 12px; }
.budget p { margin: 0; display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
.meter { height: 12px; background: #081522; border: 2px solid var(--line); border-radius: 2px; overflow: hidden; }
.meter div { height: 100%; width: 0; background: repeating-linear-gradient(135deg, var(--tape) 0 6px, #e0a800 6px 12px); transition: width 0.2s; }
.budget.over .meter div { background: repeating-linear-gradient(135deg, var(--bad) 0 6px, #c4382c 6px 12px); }
.budget.over p span:last-child { color: var(--bad); font-weight: 700; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.go { flex: 1 1 160px; padding: 14px 18px; background: var(--tape); color: var(--tape-ink); border: 0; border-radius: 3px; font: 400 14px/1 var(--font-display); box-shadow: 0 5px 0 #a97f00; }
.go:active { transform: translateY(3px); box-shadow: 0 2px 0 #a97f00; }
.ghost { padding: 12px 16px; background: transparent; border: 2px solid var(--line); border-radius: 3px; font-weight: 700; color: var(--mute); }
.draft { margin: 0 0 10px; padding: 8px 10px; border: 2px dashed var(--tape); border-radius: 3px; font-size: 14px; }

/* Resultados */
.stages { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.stage { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: start; padding: 10px 12px; background: #0b1d30; border: 2px solid var(--line-soft); border-radius: 3px; }
.stage .n { grid-row: span 2; font: 400 12px/1.4 var(--font-display); color: var(--mute); padding-top: 2px; }
.stage h3 { margin: 0; font-size: 15px; }
.stage p { grid-column: 2 / 4; margin: 0; color: var(--mute); font-size: 13.5px; }
.stage .st { grid-row: 1; grid-column: 3; font: 700 11px/1 var(--font-body); letter-spacing: 0.08em; padding: 4px 7px; border-radius: 2px; background: #14304d; color: var(--mute); }
.stage ul { grid-column: 2 / 4; margin: 4px 0 0; padding-left: 18px; font-size: 14px; }
.stage li { margin: 2px 0; }
.stage.ok { border-color: var(--ok); }
.stage.ok .st { background: var(--ok); color: #05281b; }
.stage.ok .n { color: var(--ok); }
.stage.bad { border-color: var(--bad); }
.stage.bad .st { background: var(--bad); color: #2b0805; }
.stage.bad .n { color: var(--bad); }
.stage.bad p { color: var(--ink); }
.summary { margin: 12px 0 0; font-size: 14.5px; }
.summary:empty { display: none; }
.win { margin-top: 12px; padding: 14px 16px; border: 2px solid var(--ok); border-radius: 3px; background: #0b2a24; }
.win h2 { color: var(--ok); }
.stars { font-size: 26px; letter-spacing: 6px; color: var(--tape); line-height: 1.2; }
.win dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 8px 0 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.win dt { color: var(--mute); }
.win dd { margin: 0; font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  .cell.crack { animation: none; }
  .meter div { transition: none; }
}
</style>

<div class="wrap">
  <header>
    <h1>¿Aguantará la <span>estructura</span>?</h1>
    <div class="bar">
      <div class="seg" role="group" aria-label="Modo de juego">
        <button type="button" id="mk" aria-pressed="true">Niños</button>
        <button type="button" id="mb" aria-pressed="false">Empresarios</button>
      </div>
      <div class="levels" id="levels" role="group" aria-label="Nivel"></div>
    </div>
    <ol class="steps" aria-label="Cómo se juega">
      <li><b>1</b> Construye</li>
      <li><b>2</b> Prueba</li>
      <li><b>3</b> Corrige</li>
    </ol>
  </header>

  <div class="main">
    <section id="brief" class="card" aria-labelledby="hb">
      <h2 id="hb">Pedido del cliente</h2>
      <p id="intro"></p>
      <ul class="chips" id="chips"></ul>
      <p id="wind" class="fine"></p>
      <p id="fine" class="fine"></p>
    </section>

    <section id="build" aria-label="Zona de construcción">
      <div class="board" id="board" role="group" aria-label="Estructura en construcción"></div>
      <div class="soil" aria-hidden="true"></div>
      <div class="tools" id="tools" role="group" aria-label="Piezas"></div>
      <p class="hint" id="hint" aria-live="polite"></p>
      <p class="draft" id="draft" hidden></p>
      <div class="budget" id="budget">
        <p><span id="bl">Presupuesto</span><span id="bv"></span></p>
        <div class="meter" aria-hidden="true"><div id="bm"></div></div>
      </div>
      <div class="actions">
        <button type="button" class="go" id="go">PROBAR</button>
        <button type="button" class="ghost" id="clear">Limpiar</button>
      </div>
    </section>

    <section id="results" class="card" aria-labelledby="hr">
      <h2 id="hr">Pruebas de estabilidad</h2>
      <ol class="stages" id="stages"></ol>
      <p class="summary" id="summary" aria-live="polite"></p>
      <div id="win"></div>
    </section>
  </div>
</div>

<script>
/* Motor de ¿Aguantará la estructura?
   Diseño liviano: sin bucle de animación, todo se calcula una sola vez por prueba.
   La rejilla es un Uint8Array plano de 6x5 = 30 celdas (índice = fila*W + columna, fila 0 = suelo).
   Códigos: 0 vacío, 1 Base, 2 Pilar, 3 Refuerzo, 4 Puente, 10+n módulo n. */
var W = 6, H = 5;
var BASE = 1, PILAR = 2, REFUERZO = 3, PUENTE = 4, MOD0 = 10;
var COST = { 1: 3, 2: 2, 3: 3, 4: 1 };

function capOf(v) { return v === 1 ? 9 : v === 2 ? 5 : v === 3 ? 6 : v >= 10 ? 3 : 0; }

function costOf(g) {
  var t = 0;
  for (var i = 0; i < g.length; i++) if (g[i] > 0 && g[i] < 10) t += COST[g[i]];
  return t;
}

function findCell(g, code) {
  for (var i = 0; i < g.length; i++) if (g[i] === code) return i;
  return -1;
}

/* Peso: baja columna por columna, de arriba hacia abajo. Una sola pasada por celda. */
function gravity(g, loads, f, weak) {
  var probs = [], stress = [];
  for (var c = 0; c < W; c++) {
    var carry = 0;
    for (var r = H - 1; r >= 0; r--) {
      var i = r * W + c, v = g[i];
      if (v === 0) {
        if (carry > 0) { probs.push({ i: i, code: r === 0 ? 'sinBase' : 'aire' }); break; }
        continue;
      }
      if (v === 4) {
        if (carry > 0) { probs.push({ i: i, code: 'viga' }); break; }
        continue;
      }
      var cap = capOf(v);
      if (i === weak) cap = cap / 2;
      if (carry > cap + 1e-9) { probs.push({ i: i, code: 'sobrecarga', need: carry, cap: cap }); break; }
      if (carry > 0 && v !== 3) stress.push({ i: i, util: carry / capOf(v) });
      if (v >= 10) carry += loads[v - 10] * f;
    }
  }
  return { probs: probs, stress: stress };
}

/* Viento: una torre alta necesita ataduras. Puente válido = tiene algo a ambos lados. */
function wind(g, free) {
  var h = [], ties = [], probs = [], r, c, d;
  for (c = 0; c < W; c++) {
    var n = 0;
    while (n < H && g[n * W + c] !== 0) n++;
    h.push(n); ties.push(0);
  }
  for (r = 1; r < H; r++) {
    for (c = 0; c < W; c++) {
      var v = g[r * W + c];
      if (v === 3 && r < h[c]) ties[c]++;
      if (v === 4 && c > 0 && c < W - 1 && g[r * W + c - 1] && g[r * W + c + 1]) {
        for (d = -1; d <= 1; d++) if (r < h[c + d]) ties[c + d]++;
      }
    }
  }
  for (c = 0; c < W; c++) {
    if (h[c] > free + ties[c]) probs.push({ i: (h[c] - 1) * W + c, code: 'viento', h: h[c], max: free + ties[c] });
  }
  return probs;
}

/* Comunicación entre áreas: sólo viajan por módulos y puentes, nunca por los cimientos. */
function linked(g, a, b) {
  var s = findCell(g, MOD0 + a), t = findCell(g, MOD0 + b);
  if (s < 0 || t < 0) return false;
  var seen = new Uint8Array(W * H), q = [s];
  seen[s] = 1;
  while (q.length) {
    var i = q.pop();
    if (i === t) return true;
    var r = (i / W) | 0, c = i % W, ns = [];
    if (r > 0) ns.push(i - W);
    if (r < H - 1) ns.push(i + W);
    if (c > 0) ns.push(i - 1);
    if (c < W - 1) ns.push(i + 1);
    for (var k = 0; k < ns.length; k++) {
      var j = ns[k];
      if (!seen[j] && (g[j] === 4 || g[j] >= 10)) { seen[j] = 1; q.push(j); }
    }
  }
  return false;
}

function loadsOf(L) { return L.mods.map(function (m) { return m.load; }); }

/* Revisión previa: se hace antes de las pruebas y no gasta nada extra. */
function precheck(g, L) {
  var out = { missing: [], wrong: [], over: false, links: [] }, k;
  for (k = 0; k < L.mods.length; k++) {
    var at = findCell(g, MOD0 + k);
    if (at < 0) out.missing.push(k);
    else if (((at / W) | 0) !== L.mods[k].row) out.wrong.push(k);
  }
  out.over = costOf(g) > L.budget;
  for (k = 0; k < L.links.length; k++) {
    if (out.missing.length === 0 && !linked(g, L.links[k][0], L.links[k][1])) out.links.push(L.links[k]);
  }
  out.ok = out.missing.length === 0 && out.wrong.length === 0 && !out.over && out.links.length === 0;
  return out;
}

function stagePresion(g, L) {
  var gr = gravity(g, loadsOf(L), L.fp, -1);
  return { id: 'presion', probs: gr.probs.concat(wind(g, L.free)) };
}

/* Errores: cualquier pieza podría debilitarse a la mitad. Ninguna debe trabajar a más del 50% de su fuerza.
   Los Refuerzos tienen respaldo y no se evalúan. Una sola pasada, sin repetir el cálculo por pieza. */
function stageErrores(g, L) {
  var base = gravity(g, loadsOf(L), 1, -1), probs = [], weak = -1, best = -1;
  for (var k = 0; k < base.stress.length; k++) {
    var s = base.stress[k];
    if (s.util > best) { best = s.util; weak = s.i; }
    if (s.util > 0.5 + 1e-9) probs.push({ i: s.i, code: 'margen', util: s.util });
  }
  return { id: 'errores', weak: weak, worst: best < 0 ? 0 : best, probs: base.probs.concat(probs) };
}

function stageCambios(g, L) {
  var ch = L.change;
  if (ch.kind === 'peso') {
    var loads = loadsOf(L);
    loads[ch.mod] += ch.extra;
    return { id: 'cambios', probs: gravity(g, loads, 1, -1).probs };
  }
  if (linked(g, ch.a, ch.b)) return { id: 'cambios', probs: [] };
  return { id: 'cambios', probs: [{ i: findCell(g, MOD0 + ch.a), code: 'enlace', a: ch.a, b: ch.b, j: findCell(g, MOD0 + ch.b) }] };
}

/* Crecimiento: llega un módulo nuevo. Se prueba sólo encima de cada torre (máximo 6 candidatos). */
function stageCrecimiento(g, L) {
  var loads = loadsOf(L).concat([L.grow]), code = MOD0 + L.mods.length;
  var best = null, found = false;
  for (var c = 0; c < W && !found; c++) {
    var h = 0;
    while (h < H && g[h * W + c] !== 0) h++;
    if (h === 0 || h >= H) continue;
    var below = g[(h - 1) * W + c];
    if (below === 4) continue;
    var t = new Uint8Array(g);
    t[h * W + c] = code;
    var probs = gravity(t, loads, 1, -1).probs.concat(wind(t, L.free));
    if (probs.length === 0) { found = true; best = { slot: h * W + c, probs: [] }; }

  }

  function revealStage(k, s, res) {
    var el = $('st' + k), st = el.querySelector('.st'), h = '', i;
    el.classList.remove('ok', 'bad');
    if (s.ok) {
      el.classList.add('ok'); st.textContent = 'OK';
      if (s.id === 'errores' && s.worst > 0) { var wp = Math.round(s.worst * 100); el.querySelector('p').textContent += ' ' + (state.mode === 'k' ? 'La pieza más exigida trabaja al ' + wp + '%.' : 'El componente más exigido opera al ' + wp + '%.'); }
      if (s.id === 'errores' && s.weak >= 0) cells[s.weak].classList.add('weak');
      if (s.id === 'crecimiento' && s.slot !== undefined) cells[s.slot].classList.add('newslot');
    } else {
      el.classList.add('bad'); st.textContent = 'FALLA';
      var seen = {}, lines = [];
      for (i = 0; i < s.probs.length; i++) {
        var p = s.probs[i], key = p.code + p.i;
        if (seen[key]) continue;
        seen[key] = 1; lines.push(fmtProb(p, s.id));
        if (p.i >= 0 && s.id !== 'crecimiento') cells[p.i].classList.add('crack');
        if (p.code === 'enlace' && p.j >= 0) cells[p.j].classList.add('crack');
      }
      if (s.id === 'errores' && s.weak >= 0) cells[s.weak].classList.add('weak');
      var shown = lines.slice(0, 3);
      h = '<ul>';
      for (i = 0; i < shown.length; i++) h += '<li>' + shown[i] + '</li>';
      if (lines.length > 3) h += '<li>y ' + (lines.length - 3) + ' problema' + (lines.length - 3 > 1 ? 's' : '') + ' más.</li>';
      h += '</ul>';
      el.insertAdjacentHTML('beforeend', h);
    }
  }

  function stars(cost) { var par = L().par; return cost <= par + 1 ? 3 : cost <= par + 4 ? 2 : 1; }

  function showWin(res) {
    var cost = costOf(G()), tot = L().budget, st = stars(cost), att = state.attempts[state.level];
    var score = Math.max(100, 1000 - (att - 1) * 60 + (tot - cost) * 15);
    if (st > state.stars[state.level]) { state.stars[state.level] = st; persist(); paintLevels(); }
    var s = ''; for (var j = 0; j < 3; j++) s += j < st ? '★' : '☆';
    var next = state.level < LEVELS.length - 1;
    var title = state.mode === 'k' ? '¡Tu estructura aguantó!' : 'El sistema superó las cuatro pruebas';
    var tip = st === 3 ? (state.mode === 'k' ? 'Casi no se puede construir más barato.' : 'Costo casi óptimo para este pedido.')
      : (state.mode === 'k' ? 'Se puede lograr con menos dinero. Prueba reemplazar piezas fuertes donde no hacen falta.' : 'Hay margen para optimizar el costo sin perder resistencia.');
    $('win').innerHTML = '<div class="win"><h2>' + title + '</h2><div class="stars" aria-label="' + st + ' de 3 estrellas">' + s + '</div><dl><dt>Costo</dt><dd>$' + cost + ' de $' + tot + '</dd><dt>Pruebas hechas</dt><dd>' + att + '</dd><dt>Puntos</dt><dd>' + score + '</dd></dl><p>' + tip + '</p>' +
      (next ? '<div class="actions"><button type="button" class="go" id="nextlv">SIGUIENTE NIVEL</button></div>' : '') + '</div>';
    var nb = $('nextlv'); if (nb) nb.addEventListener('click', function () { setLevel(state.level + 1); });
  }

  function probar() {
    resetResults();
    var res = runTests(G(), L()), sum = $('summary'), k;
    state.attempts[state.level]++;
    if (!res.pre.ok) {
      var out = [];
      if (res.pre.missing.length) out.push((state.mode === 'k' ? 'Faltan módulos: ' : 'Faltan áreas: ') + res.pre.missing.map(modName).join(', ') + '. Elígelos arriba y colócalos en su piso.');
      if (res.pre.over) out.push('Te pasaste del presupuesto por $' + (costOf(G()) - L().budget) + '. Quita piezas que no hagan falta.');
      for (k = 0; k < res.pre.links.length; k++) out.push(fill(MSG.enlace[state.mode], { a: modName(res.pre.links[k][0]), b: modName(res.pre.links[k][1]) }));
      sum.textContent = 'Todavía no se puede probar. ' + out.join(' ');
      return;
    }
    var n = res.stages.length;
    function step(k) {
      var s = res.stages[k];
      revealStage(k, s, res);
      if (k === n - 1) {
        if (res.ok) { sum.textContent = state.mode === 'k' ? 'Las cuatro pruebas salieron bien.' : 'Presión, errores, cambios y crecimiento: todo en verde.'; showWin(res); }
        else sum.textContent = (state.mode === 'k' ? 'Se cayó en la prueba ' : 'Falló la prueba ') + (k + 1) + ' de 4. Corrige las piezas marcadas en rojo y vuelve a probar.';
      }
    }
    for (k = 0; k < n; k++) {
      (function (kk) {
        if (RM) step(kk);
        else state.timers.push(setTimeout(function () { step(kk); }, kk * 650));
      })(k);
    }
  }

  /* ---------- Niveles y modo ---------- */
  function setLevel(n) {
    state.level = n; state.lastKey = [];
    state.tool = 'P';
    resetResults();
    paintLevels(); paintBrief(); paintTools(); paintAll(true); paintLabels(); updateBudget(); setHint(); markCan();
    $('draft').hidden = !(n === 0 && state.draftShown);
  }
  function setMode(m) {
    state.mode = m; state.lastKey = []; persist();
    $('mk').setAttribute('aria-pressed', m === 'k'); $('mb').setAttribute('aria-pressed', m === 'b');
    resetResults();
    paintLevels(); paintBrief(); paintTools(); paintAll(true); paintLabels(); updateBudget(); setHint(); markCan();
    $('draft').textContent = m === 'k' ? 'Borrador de ejemplo. Presiona PROBAR y mira qué pasa. Después corrige.' : 'Borrador de ejemplo. Ejecuta la prueba, revisa dónde falla y corrige.';
  }

  /* ---------- Eventos ---------- */
  board.addEventListener('click', function (e) {
    var b = e.target.closest('.cell'); if (b && !b.disabled) place(+b.getAttribute('data-i'));
  });
  board.addEventListener('keydown', function (e) {
    var d = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: W, ArrowDown: -W }[e.key];
    if (!d) return;
    var b = e.target.closest('.cell'); if (!b) return;
    var i = +b.getAttribute('data-i'), j = i + d;
    while (j >= 0 && j < W * H && cells[j].disabled && Math.abs(d) === 1 && ((j / W) | 0) === ((i / W) | 0)) j += d;
    if (j >= 0 && j < W * H && cells[j] && !cells[j].disabled && (Math.abs(d) !== 1 || ((j / W) | 0) === ((i / W) | 0))) { e.preventDefault(); cells[j].focus(); }
  });
  $('tools').addEventListener('click', function (e) { var b = e.target.closest('.tool'); if (b) selectTool(b.getAttribute('data-tool')); });
  $('chips').addEventListener('click', function (e) { var b = e.target.closest('.chip'); if (b) selectTool('m' + b.getAttribute('data-mod')); });
  $('levels').addEventListener('click', function (e) { var b = e.target.closest('.lv'); if (b) setLevel(+b.getAttribute('data-lv')); });
  $('mk').addEventListener('click', function () { setMode('k'); });
  $('mb').addEventListener('click', function () { setMode('b'); });
  $('go').addEventListener('click', probar);
  $('clear').addEventListener('click', function () {
    var g = G(); for (var i = 0; i < g.length; i++) g[i] = 0;
    paintAll(); afterEdit();
  });

  /* ---------- Arranque ---------- */
  buildBoard();
  $('mk').setAttribute('aria-pressed', state.mode === 'k'); $('mb').setAttribute('aria-pressed', state.mode === 'b');
  setMode(state.mode);
  setLevel(0);
  $('draft').hidden = false;
})();
</script>

</body></html>
